<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Lfurtif</title>
</head>
<body>
    <canvas id="blob-canvas"></canvas>
    
    <main class="grid">
        <header class="card profile">
            <div class="profile-head">
                <img src="ressources/lfurtif.jpg" alt="Profile" width="100" height="100">
                <h2>Lfurtif</h2>
            </div>
            <h5>Cybersecurity and Programming enthusiast</h5>
        </header>

        <section class="card repo-carousel">
            <h2>Check out my projects !</h2>
            <div id="repo-list" class="repo-grid"></div>
        </section>

        <section class="card socials">
            <h3>GitHub Contributions</h3>
            <div class="calendar-container">
                <img id="github-calendar" src="" alt="GitHub Contributions Calendar">
            </div>
            <div class="social-links">
                <a href="https://github.com/lfurtif" target="_blank" class="social-icon">
                    <img src="https://cdn.simpleicons.org/github/ffffff" alt="GitHub" width="32" height="32">
                </a>
                <!-- <a href="https://x.com/l_furtif_" target="_blank" class="social-icon">
                    <img src="https://cdn.simpleicons.org/x/ffffff" alt="X" width="32" height="32"> -->
                </a>
            </div>
        </section>
    </main>

    <script src="back.js"></script>
    <script src="script.js"></script>
</body>
</html>
