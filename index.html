<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <link rel="stylesheet" href="styles.css">
    <title>Lfurtif</title>
</head>
<body>
    <canvas id="blob-canvas" aria-hidden="true"></canvas>

    <main class="page">
        <div class="about-grid">
            <header class="card profile">
                <div class="profile-head">
                    <img src="ressources/lfurtif.jpg" alt="Profile" width="88" height="88">
                    <div>
                        <h2>Lfurtif</h2>
                        <p>Red team · Dev · Design</p>
                    </div>
                </div>
                <p class="status"><span class="status-dot"></span>Status: Learning</p>
                <p class="goal">Goal: OSCP</p>
            </header>

            <section class="card focus">
                <h3>Focus</h3>
                <ul>
                    <li><b>Graphic design</b><span>UI, visuals, branding</span></li>
                    <li><b>Development</b><span>Tools, automation, Android</span></li>
                    <li><b>Offsec</b><span>Labs, exploitation, red team</span></li>
                </ul>
            </section>
        </div>

        <section class="repos-grid">
            <div class="repos-head">
                <h2>Projects</h2>
                <span class="hint">Drag to browse</span>
            </div>
            <div class="carousel-viewport" id="carousel-viewport" aria-label="GitHub projects carousel">
                <div id="repo-list" class="carousel-track"></div>
            </div>
        </section>

        <section class="card socials">
            <div class="socials-head">
                <h3>Contributions</h3>
                <div class="social-links">
                    <a href="https://github.com/lfurtif" target="_blank" rel="noopener noreferrer" class="social-icon">
                        <img src="https://cdn.simpleicons.org/github/ffffff" alt="GitHub" width="32" height="32">
                    </a>
                </div>
            </div>
            <div class="calendar-container">
                <img id="github-calendar" src="" alt="GitHub Contributions Calendar">
            </div>
        </section>
    </main>

    <script src="back.js"></script>
    <script src="script.js"></script>
</body>
</html>
